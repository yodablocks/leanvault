name: shadow

# Shadow pass of the curator against the real strategies, every six hours.
# GitHub delays or skips scheduled runs under load; four a day is enough for
# stress detection in lending vaults and keeps the token cost modest. Appends the
# snapshots, judgments and plans to the `shadow-log` branch, which is the
# record that decides whether the agent ever gets the allocator key.
# Needs the TYPESAFE_API_KEY repository secret; without it the run skips.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shadow-log
  cancel-in-progress: false

jobs:
  shadow:
    name: Shadow pass
    runs-on: ubuntu-latest
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      # Alchemy URLs as secrets, since the URL carries the key. Public endpoints throttle at this call volume.
      ETH_RPC_URL: ${{ secrets.ETH_RPC_URL || 'https://ethereum-rpc.publicnode.com' }}
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL || 'https://mainnet.base.org' }}
      CURATOR_CONCURRENCY: "4"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore the log so the history feeds the signals
        run: |
          mkdir -p curator/data
          if git fetch --depth=1 origin shadow-log 2>/dev/null; then
            git show origin/shadow-log:snapshots.jsonl > curator/data/snapshots.jsonl 2>/dev/null || true
            git show origin/shadow-log:judgments.jsonl > curator/data/judgments.jsonl 2>/dev/null || true
            git show origin/shadow-log:proposals.jsonl > curator/data/proposals.jsonl 2>/dev/null || true
          fi
          wc -l curator/data/*.jsonl 2>/dev/null || echo "no history yet"

      - name: Shadow pass
        working-directory: curator
        run: |
          if [ -z "$TYPESAFE_API_KEY" ]; then
            echo "TYPESAFE_API_KEY secret is not set; taking snapshots only"
            bun run src/cli.ts observe
          else
            bun run src/cli.ts shadow
          fi

      - name: Append to the shadow-log branch
        run: |
          set -e
          # Check the log branch out into an empty directory first, then lay the
          # new files over it. Copying first made the checkout refuse to overwrite them.
          tmp=$(mktemp -d)
          cd "$tmp"
          git init -q
          git config user.name "shadow-bot"
          git config user.email "shadow-bot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch --depth=1 origin shadow-log 2>/dev/null; then
            git checkout -q -b shadow-log origin/shadow-log
          else
            git checkout -q --orphan shadow-log
            printf '# shadow-log\n\nAppend-only record written by the shadow workflow. Not code.\n' > README.md
          fi
          cp "$GITHUB_WORKSPACE"/curator/data/*.jsonl .
          git add -A
          git commit -q -m "shadow pass $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing new"; exit 0; }
          git push -q origin shadow-log

      # After the append, so an unhealthy pass is still recorded. A red run here
      # means the pass is incomplete: a vault unjudged, no plan, DefiLlama down,
      # the history not restored, or the key missing and snapshots taken alone.
      - name: Check the pass
        working-directory: curator
        run: bun run src/cli.ts health
