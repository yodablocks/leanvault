[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.37"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000_000
via_ir = false
ignored_warnings_from = ["lib"]
fuzz = { runs = 256 }

[profile.ci]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.37"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000_000
via_ir = false
ignored_warnings_from = ["lib"]
fuzz = { runs = 512 }

# forge lint on Foundry 1.8 flags every Deposit, Withdraw and Transfer event as
# "emitted after an external call". In this contract every event is emitted
# before the asset transfer, which is the last statement of each function, so
# the rule is excluded rather than the code reordered against the CEI pattern.
[lint]
exclude_lints = [
  "reentrancy-events",
  # Timelocks and rebalance windows compare block.timestamp by design; they are
  # hours to days long, far beyond what a validator can shift.
  "block-timestamp",
  # The allocator vault loops over its allowlisted strategies for the withdrawal
  # queue and the harvest sum. The list is owner-controlled and capped at
  # MAX_STRATEGIES, so the loops are bounded.
  "calls-loop",
]
